<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CosmicCoin Galaxy - Referral Program</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <header class="bg-purple-600 text-white p-4">
        <div class="container mx-auto">
            <h1 class="text-3xl font-bold">CosmicCoin Galaxy</h1>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-8">
        <div class="bg-white rounded-xl shadow-md overflow-hidden p-8 mb-8">
            <div class="uppercase tracking-wide text-sm text-purple-500 font-semibold">Welcome to CosmicCoin</div>
            <h2 class="block mt-1 text-lg leading-tight font-medium text-black">Join the Cosmic Revolution</h2>
            <p class="mt-2 text-gray-500">Explore the vast possibilities of decentralized finance with CosmicCoin.</p>
        </div>

        <div id="referralSection" class="bg-white rounded-xl shadow-md overflow-hidden p-8">
            <h2 class="text-2xl font-bold mb-4">Referral Program</h2>
            <p class="mb-4">Invite friends to earn more CosmicCoin!</p>
            <button id="inviteButton" class="bg-purple-500 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-full">Invite a Friend</button>
            <p id="inviteMessage" class="mt-4 text-green-500 font-bold hidden">You earned 10 CosmicCoin!</p>
            <p id="inviteCount" class="mt-2 text-gray-700">Total Invites: 0</p>
            <div id="shareOptions" class="hidden mt-4 grid grid-cols-2 gap-2">
                <button id="copyBtn" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">Copy Link</button>
                <button id="emailBtn" class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600">Share via Email</button>
                <button id="twitterBtn" class="px-4 py-2 bg-blue-400 text-white rounded hover:bg-blue-500">Share on Twitter</button>
                <button id="facebookBtn" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Share on Facebook</button>
                <button id="moreOptionsBtn" class="col-span-2 px-4 py-2 bg-gray-300 text-gray-800 rounded hover:bg-gray-400">More Options</button>
            </div>
        </div>
    </main>

    <footer class="bg-purple-600 text-white p-4 mt-8">
        <div class="container mx-auto text-center">
            <p>&copy; CosmicCoin Galaxy. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Constants
        const WAPCHAT_APP_LINK = 'https://apkpure.com/wapchat/wapchat.actb';
        const TELEGRAM_BOT_LINK = 'https://t.me/CosmicCoinGalaxyAirdrop_Bot';
        const WAPCHAT_INFO = 'Wapchat: A social networking platform connecting people, fostering relationships, and sparking conversations.';
        const AIRDROP_INSTRUCTIONS = [
            "1. Sign up on the Wapchat app",
            "2. After successful sign-up, click the side menu button",
            "3. Locate and select 'Cosmic Airdrop'",
            "4. Start earning CosmicCoin!"
        ];

        let inviteCount = 0;

        // Show a message and update invite count
        function handleInviteClick() {
            inviteCount++;
            document.getElementById('inviteMessage').classList.remove('hidden');
            document.getElementById('inviteCount').textContent = `Total Invites: ${inviteCount}`;
        }

        // Initialize the invite functionality
        document.addEventListener('DOMContentLoaded', () => {
            const inviteButton = document.getElementById('inviteButton');
            inviteButton.addEventListener('click', handleInviteClick);

            const shareOptions = document.getElementById('shareOptions');
            const referralCode = 'CC' + Math.random().toString(36).substr(2, 8).toUpperCase();
            const shareText = `Join me in earning CosmicCoin through the CosmicCoin Galaxy Airdrop!

${WAPCHAT_INFO}

Airdrop Instructions:
${AIRDROP_INSTRUCTIONS.join('\n')}

Telegram Mini App: ${TELEGRAM_BOT_LINK}?start=${referralCode}

Wapchat App: ${WAPCHAT_APP_LINK}`;

            inviteButton.addEventListener('click', () => {
                shareOptions.classList.toggle('hidden');
            });

            document.getElementById('copyBtn').addEventListener('click', () => {
                navigator.clipboard.writeText(shareText).then(() => {
                    alert('Copied to clipboard!');
                });
            });
        });
    </script>
</body>
</html>
